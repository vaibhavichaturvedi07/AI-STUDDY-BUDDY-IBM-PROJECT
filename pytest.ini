# pytest configuration for AI Study Buddy
[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --strict-markers
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

markers =
    unit:       fast unit tests with mocked dependencies
    integration: tests that hit a real database
    slow:       tests that call external APIs (skip with -m "not slow")
